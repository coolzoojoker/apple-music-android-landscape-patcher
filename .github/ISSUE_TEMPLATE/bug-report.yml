name: Bug 报告
description: 报告可复现的构建、安装或横屏交互问题
title: "[Bug] "
labels: ["bug", "待确认"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认输入为 Apple Music 6.5.0 (1580)。不要上传 Apple APK、账号、完整未脱敏日志或车机工程密码。
  - type: dropdown
    id: profile
    attributes:
      label: 构建配置
      options:
        - tv-armv7
        - tv-arm64
        - car-arm64
        - tv-armv7-xhdpi
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 例如“索尼 K-85XR70，Android 12，armeabi-v7a，1920×1080 逻辑分辨率”
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 切换到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志或截图
      description: 删除 Apple ID、设备序列号、IP、令牌和其他个人信息后再粘贴。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我没有上传 Apple Music APK、APKM、DEX 或签名密钥。
          required: true
        - label: 我已删除日志中的账号、IP 和设备标识。
          required: true

